name: Solidity compile and node tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run compile

      - name: Ganache EVM contract integration
        run: npm run test:evm
      - name: Contract security regressions
        run: node --test --test-isolation=none test/security.integration.test.mjs
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix web ci --ignore-scripts
      - run: npm run build:card
      - run: npm run test:card
