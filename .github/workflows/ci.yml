name: Solidity compile and node tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm run compile
      - name: Fruit market contract and model tests
        run: npm run test:market

      - name: Source-verification HTTP and factory-bundle tests
        run: node --test --test-isolation=none test/source-verification.test.mjs
      - name: Ganache EVM contract integration
        run: npm run test:evm
      - name: Contract security regressions
        run: node --test --test-isolation=none test/security.integration.test.mjs
      - name: Reserve final settlement regressions
        run: node --test --test-isolation=none test/settlement.integration.test.mjs
      - name: ABI and frontend rule compatibility
        run: node --test --test-isolation=none test/compatibility.integration.test.mjs
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run compile
      - run: npm --prefix web ci --ignore-scripts
      - run: npm run build:card
      - run: npm run build:card:testnet
      - run: npm run test:card

      - run: npm run test:static
      - run: npm run check:public
